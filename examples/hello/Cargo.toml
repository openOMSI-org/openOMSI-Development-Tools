[package]
name = "hello"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
openomsi-plugin-sdk = { path = "../../crates/openomsi-plugin-sdk" }

# A plugin is its own tiny workspace so it builds only for wasm32, apart from the devtools.
[workspace]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
