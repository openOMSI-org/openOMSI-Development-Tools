[package]
name = "openomsi-devtools"
description = "openOMSI Development Tools: the desktop app for writing, building and signing openOMSI plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[[bin]]
name = "openomsi-devtools"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
oop-format = { workspace = true }
oopc = { path = "../../crates/oopc", version = "0.2.0" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1"
dirs = "7"
tauri = { version = "2.12", features = [] }
rfd = "0.15"
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.11"
zip = { version = "9.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
