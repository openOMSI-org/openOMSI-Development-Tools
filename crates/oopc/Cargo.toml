[package]
name = "oopc"
description = "The openOMSI plugin compiler: build, pack, sign and inspect .oop plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "oopc"
path = "src/main.rs"

[dependencies]
oop-format = { workspace = true }
lua-obfuscator = { path = "../lua-obfuscator", version = "0.1.0" }
wasm-strip = { path = "../wasm-strip", version = "0.1.0" }
full_moon = { version = "3", features = ["lua54"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"

[dev-dependencies]
tempfile = "3"
