name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p oop-format -p lua-obfuscator -p wasm-strip -p openomsi-plugin-sdk -p oopc -p xtask --all-targets -- -D warnings
      - name: Test
        run: cargo test -p oop-format -p lua-obfuscator -p wasm-strip -p openomsi-plugin-sdk -p oopc -p xtask
      - name: SDK builds for wasm32
        run: cargo build -p openomsi-plugin-sdk --target wasm32-unknown-unknown
      - name: oop-format builds for wasm32
        run: cargo build -p oop-format --target wasm32-unknown-unknown
      - name: Example plugins build to wasm
        shell: bash
        run: |
          for ex in hello speed-warner stop-announcer; do
            cargo build --release --manifest-path "examples/$ex/Cargo.toml" --target wasm32-unknown-unknown
          done

  app:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: System libraries (Tauri on Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (app)
        run: cargo clippy --locked -p openomsi-devtools --all-targets -- -D warnings
      - name: Tests (app)
        run: cargo test --locked -p openomsi-devtools
      - name: Build (app)
        run: cargo build --locked -p openomsi-devtools
