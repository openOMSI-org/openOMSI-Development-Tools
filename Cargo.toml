[workspace]
resolver = "3"
members = [
    "crates/oop-format",
    "crates/lua-obfuscator",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/openOMSI-Project/openOMSI-Development-Tools"
homepage = "https://openomsi-project.github.io/openOMSI-Development-Tools/"
authors = ["usonskyyyy"]

[workspace.dependencies]
oop-format = { path = "crates/oop-format", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 1
