[workspace]
resolver = "3"
members = [
    "crates/oop-format",
    "crates/lua-obfuscator",
    "crates/wasm-strip",
    "crates/openomsi-plugin-sdk",
    "crates/oopc",
    "apps/devtools",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/openOMSI-org/openOMSI-Development-Tools"
homepage = "https://openomsi-org.github.io/openOMSI-Development-Tools/"
authors = ["usonskyyyy"]

[workspace.dependencies]
oop-format = { path = "crates/oop-format", version = "0.1.0" }
lua-obfuscator = { path = "crates/lua-obfuscator", version = "0.1.0" }
wasm-strip = { path = "crates/wasm-strip", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 1

# wgpu from the org's fork (upstream v29.0.4 plus fixes), the same revision openOMSI uses, so the
# devtools render with exactly the backend the game ships. Every fork crate Cargo.lock pulls in is
# patched (an unused patch is dropped with a warning).
[patch.crates-io]
wgpu = { git = "https://github.com/openOMSI-Project/wgpu-openomsi", rev = "4eb06e5bf8062be2978d93e95556a4dd83f1d3b8" }
wgpu-core = { git = "https://github.com/openOMSI-Project/wgpu-openomsi", rev = "4eb06e5bf8062be2978d93e95556a4dd83f1d3b8" }
wgpu-core-deps-apple = { git = "https://github.com/openOMSI-Project/wgpu-openomsi", rev = "4eb06e5bf8062be2978d93e95556a4dd83f1d3b8" }
wgpu-core-deps-emscripten = { git = "https://github.com/openOMSI-Project/wgpu-openomsi", rev = "4eb06e5bf8062be2978d93e95556a4dd83f1d3b8" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/openOMSI-Project/wgpu-openomsi", rev = "4eb06e5bf8062be2978d93e95556a4dd83f1d3b8" }
wgpu-hal = { git = "https://github.com/openOMSI-Project/wgpu-openomsi", rev = "4eb06e5bf8062be2978d93e95556a4dd83f1d3b8" }
wgpu-types = { git = "https://github.com/openOMSI-Project/wgpu-openomsi", rev = "4eb06e5bf8062be2978d93e95556a4dd83f1d3b8" }
wgpu-naga-bridge = { git = "https://github.com/openOMSI-Project/wgpu-openomsi", rev = "4eb06e5bf8062be2978d93e95556a4dd83f1d3b8" }
naga = { git = "https://github.com/openOMSI-Project/wgpu-openomsi", rev = "4eb06e5bf8062be2978d93e95556a4dd83f1d3b8" }
